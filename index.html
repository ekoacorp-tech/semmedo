<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sem Medo</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f3d3e">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sem Medo">
<style>
/* Paleta: trocar aqui pelas cores oficiais da Ekoa */
:root{--ink:#0f3d3e;--br:#13807a;--ac:#ff7a59;--bg:#faf6ef;--cd:#fff;--mu:#6b7c7c;--ok:#1f9d6b;--bad:#d64545;--ln:#e8e1d4}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,var(--ink),var(--br));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;border-radius:0 0 22px 22px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px;letter-spacing:-.3px}header small{opacity:.8}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
#mes{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:20px;padding:8px 12px;font-size:14px;max-width:55%}#mes option{color:#000}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--cd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0f3d3e12}
h3{margin:18px 4px 8px;font-size:15px}h4{margin:0 0 8px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:11px;border:1.5px solid var(--ln);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink);margin:14px 0}.sw input{width:22px;height:22px}
button{font:inherit;border:0;border-radius:14px;padding:13px;cursor:pointer}
.pri{background:var(--ac);color:#fff;width:100%;font-weight:700;font-size:16px;margin-top:6px}
.sec{background:#eef5f3;color:var(--ink);padding:8px 12px;border-radius:10px}
.vd{background:#f1f8f6;border-radius:14px;padding:12px;margin:8px 0}.vd .r{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}
.bar{height:9px;background:var(--ln);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--br);border-radius:9px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mu{color:var(--mu);font-size:12px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kp .card{margin:0}.kp b{display:block;font-size:18px;margin-top:2px}
.big{background:linear-gradient(135deg,var(--ink),var(--br));color:#fff}.big .mu{color:#cfe}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln);font-size:14px}.row:last-child{border:0}
.row small{display:block;color:var(--mu)}
.don{width:120px;height:120px;border-radius:50%;margin:6px auto;position:relative}.don:after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.hist{display:flex;gap:10px;overflow-x:auto;align-items:flex-end;height:140px;padding-bottom:4px}.hist div{text-align:center;font-size:10px;min-width:34px}.hist span{display:flex;gap:2px;align-items:flex-end;height:110px;justify-content:center}.hist i{width:11px;border-radius:4px 4px 0 0}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav button{flex:1;background:none;border-radius:0;padding:10px 2px;font-size:11px;color:var(--mu);position:relative}nav button b{display:block;font-size:20px}nav .on{color:var(--ac);font-weight:700}
nav em{position:absolute;top:4px;right:22%;background:var(--ac);color:#fff;border-radius:9px;font-size:10px;padding:1px 6px;font-style:normal}
.pl{display:grid;grid-template-columns:22px 1fr 84px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln);font-size:13px}.pl input{padding:7px;font-size:13px}.pl input[type=checkbox]{width:20px;height:20px}
#t{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;z-index:20;pointer-events:none;max-width:90%;text-align:center}#t.on{opacity:1}
.x{background:none;color:var(--bad);padding:4px 8px}.sm{padding:8px 12px;font-size:13px}.ac{background:var(--ac);color:#fff}
</style></head><body>
<header><div class="top"><div><h1>Sem Medo</h1><small>dinheiro sem tabu, com clareza</small></div><select id="mes" onchange="S.ativo=this.value;sv();go(T)"></select></div></header>
<main id="v"></main><div id="t"></div>
<nav id="nv"></nav>
<script>
const MN=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const NAT0=["Alimentacao","Impostos","Custos Fixos da Casa","Custos Variáveis da Casa","Telefonia e Internet","Despesa Extras Fixas","Servicos Tomados","Creditos Tomados","Plano de Saúde"];
const FOR0=["Débito Banco do Brasil","Débito Nu Bank","Cartão de Crédito - Nu Bank","Pix","Desconto em Folha","Devolução Futuro Rael","Devolução Sankhya Viagem","Cartão de Crédito Nu - Provisão/Recorrente","Ekoa - Débito Nu Bank"];
const COR=['#13807a','#ff7a59','#f2b134','#5b8def','#9b6bd1','#e0568a','#4cb782','#8d99a6','#c27c4b'];
const $=s=>document.querySelector(s),R=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),P1=v=>((v||0)*100).toFixed(1).replace('.',',')+'%';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lab=k=>{const[y,m]=k.split('-');return MN[m-1]+' de '+y},uid=()=>Math.random().toString(36).slice(2,9);
const hoje=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const opt=(a,s)=>a.map(x=>`<option${x===s?' selected':''}>${esc(x)}</option>`).join('');
let S=JSON.parse(localStorage.getItem('sm1')||'null'),T='lancar',PL=null,CA=null,CB=null;
const sv=()=>localStorage.setItem('sm1',JSON.stringify(S));
function toast(m){const t=$('#t');t.textContent=m;t.className='on';setTimeout(()=>t.className='',2300)}
if(!S)S={naturezas:NAT0,formas:FOR0,catalogo:[],pend:[],meses:{},hist:{},ativo:null};
const keys=()=>[...new Set([...Object.keys(S.meses),...Object.keys(S.hist)])].sort();
function fixAtivo(){const ks=keys();if(!ks.length){S.ativo=null;return}const h=hoje().slice(0,7);if(!S.ativo||!ks.includes(S.ativo))S.ativo=S.meses[h]?h:Object.keys(S.meses).sort().pop()||ks.pop()}
function calc(m){let e=0,p=0,r=0,d=0,ro=0;m.entradas.forEach(x=>e+=+x.v||0);m.lancs.forEach(l=>{p+=l.prov||0;r+=l.real||0;if(l.p)d+=l.real||0;if(l.v==='Rotativa')ro+=Math.max(0,(l.prov||0)-(l.real||0))});return{ent:e,prov:p,real:r,desem:d,rot:ro}}
const M=k=>S.meses[k]?calc(S.meses[k]):S.hist[k]||{ent:0,prov:0,real:0,desem:0,rot:0};
function go(t){T=t;fixAtivo();const ks=keys();$('#mes').innerHTML=opt(ks.map(lab).map((x,i)=>x),S.ativo&&lab(S.ativo)).replace(/<option/g,'<option').split('</option>').map((o,i)=>o?o.replace('<option','<option value="'+ks[i]+'"'):'').join('</option>');if(S.ativo)$('#mes').value=S.ativo;
 const n=S.pend.length;$('#nv').innerHTML=[['lancar','✍️','Lançar'],['painel','📊','Painel'],['plan','🗓️','Planejar'],['aprov','✅','Aprovações']].map(([k,i,l])=>`<button class="${T===k?'on':''}" onclick="go('${k}')"><b>${i}</b>${l}${k==='aprov'&&n?`<em>${n}</em>`:''}</button>`).join('');
 $('#v').innerHTML={lancar:vL,painel:vP,plan:vN,aprov:vA}[t]();if(t==='lancar')val();scrollTo(0,0)}
const vazio=m=>`<div class="card">${m}</div>`;
/* ---------- 1. NOVO LANÇAMENTO ---------- */
function vL(){const m=S.meses[S.ativo];if(!S.ativo)return vazio('Comece importando seus dados em <b>Aprovações › Dados</b>.');if(!m)return vazio(`<b>${lab(S.ativo)}</b> é só histórico (sem lançamentos). Escolha outro mês ou use <b>Planejar</b>.`);
 const ds=[...new Set([...S.catalogo.map(c=>c.d),...m.lancs.map(l=>l.d)])].sort((a,b)=>a.localeCompare(b));
 const lg=(m.log||[]).slice(-6).reverse();
 return `<div class="card"><label>Descrição</label><select id="d" onchange="pick()"><option value="">Selecione…</option>${ds.map(x=>`<option>${esc(x)}</option>`).join('')}<option value="__new">＋ Nova descrição (vai para aprovação)</option></select>
 <div id="nw" hidden><label>Nome da nova descrição</label><input id="nn" placeholder="Ex.: Pet shop"></div>
 <div class="g2"><div><label>Natureza</label><select id="n">${opt(S.naturezas)}</select></div><div><label>Forma de pagamento</label><select id="f">${opt(S.formas)}</select></div></div>
 <label>Valor (R$)</label><input id="v" type="number" inputmode="decimal" step="0.01" placeholder="0,00" oninput="val()">
 <div class="g2"><div><label>Vencimento</label><input id="dv" type="date"></div><div><label>Pagamento</label><input id="dp" type="date" value="${hoje()}"></div></div>
 <label class="sw"><input type="checkbox" id="av" onchange="val()">Pagamento à vista · soma na descrição (rotativo)</label>
 <div id="vd"></div><button class="pri" onclick="lanc()">Lançar em ${lab(S.ativo)}</button></div>
 ${lg.length?`<h3>Últimos lançamentos</h3><div class="card">${lg.map(x=>`<div class="row"><span>${esc(x.d)}<small>${x.dt.split('-').reverse().join('/')}</small></span><span>${R(x.v)} <button class="x" onclick="undo('${x.id}')">desfazer</button></span></div>`).join('')}</div>`:''}`}
const line=d=>S.meses[S.ativo].lancs.find(l=>l.d===d);
function pick(){const d=$('#d').value;$('#nw').hidden=d!=='__new';const l=line(d),c=S.catalogo.find(x=>x.d===d);const s=l||c;if(s){$('#n').value=s.n;$('#f').value=s.f}
 $('#dv').value=l&&/^\d{4}-/.test(l.v||'')?l.v:'';val()}
function val(){const d=$('#d')?.value,o=$('#vd');if(!o)return;if(!d||d==='__new'){o.innerHTML='';return}
 const l=line(d),c=S.catalogo.find(x=>x.d===d),prov=l?l.prov:c?.p,real=l?.real||0,nv=+$('#v').value||0,soma=(!real||$('#av').checked||l?.v==='Rotativa')?real+nv:nv;
 const nat=$('#n').value,ls=S.meses[S.ativo].lancs.filter(x=>x.n===nat),np=ls.reduce((a,x)=>a+(x.prov||0),0),nr=ls.reduce((a,x)=>a+(x.real||0),0)-real+soma;
 if(prov==null){o.innerHTML=`<div class="vd"><b>Sem provisão</b> para esta descrição (gasto não planejado).<div class="r"><span>Realizado após lançar</span><b>${R(soma)}</b></div></div>`;return}
 const rs=prov-soma,pc=prov?Math.min(100,soma/prov*100):100;
 o.innerHTML=`<div class="vd"><div class="r"><span>Provisão</span><b>${R(prov)}</b></div><div class="r"><span>Já realizado</span><span>${R(real)}</span></div><div class="r"><span>Este lançamento</span><span>${R(nv)}</span></div><div class="bar"><i style="width:${pc}%;background:${rs<0?'var(--bad)':'var(--br)'}"></i></div><div class="r"><b>Resta na descrição</b><b class="${rs<0?'bad':'ok'}">${R(rs)}</b></div><div class="r mu"><span>Resta na natureza (${esc(nat)})</span><span class="${np-nr<0?'bad':''}">${R(np-nr)}</span></div></div>`}
function lanc(){let d=$('#d').value,v=+$('#v').value;if(!d)return toast('Escolha a descrição');if(!(v>0))return toast('Informe o valor');
 const m=S.meses[S.ativo],n=$('#n').value,f=$('#f').value,dv=$('#dv').value||null,dp=$('#dp').value||null;let nova=false;
 if(d==='__new'){d=$('#nn').value.trim();if(!d)return toast('Dê um nome à descrição');nova=true;if(!S.pend.some(x=>x.d===d)&&!S.catalogo.some(x=>x.d===d))S.pend.push({d,n,f})}
 let l=line(d);const av=$('#av').checked;
 if(!l){l={id:uid(),d,n,f,v:dv,p:dp,prov:null,real:0,itens:[]};m.lancs.push(l)}
 else{l.f=f;if(dv&&l.v!=='Rotativa')l.v=dv;if(l.v!=='Rotativa')l.p=dp;else l.p='Rotativa'}
 if(l.real>0&&!av&&l.v!=='Rotativa'&&!confirm(`Já há ${R(l.real)} lançado em "${d}". Somar a este valor?\n(Cancelar = substituir)`)){l.real=0;l.itens=[]}
 l.real=Math.round(((l.real||0)+v)*100)/100;l.itens.push({dt:dp,v});const id=uid();(m.log=m.log||[]).push({id,d,v,dt:dp||hoje()});if(m.log.length>60)m.log.shift();
 sv();toast(nova?'Lançado · descrição enviada p/ aprovação':'Lançamento registrado ✔');go('lancar')}
function undo(id){const m=S.meses[S.ativo],g=m.log.find(x=>x.id===id),l=line(g.d);if(l){l.real=Math.round((l.real-g.v)*100)/100;if(l.prov==null&&l.real<=0)m.lancs.splice(m.lancs.indexOf(l),1)}m.log=m.log.filter(x=>x.id!==id);sv();go('lancar')}
/* ---------- 2. PAINEL GERENCIAL ---------- */
function vP(){const k=S.ativo;if(!k)return vazio('Sem dados ainda.');const x=M(k),det=S.meses[k];const caixa=x.ent-x.desem,pend=x.real-x.desem,sr=x.ent-x.real,proj=sr-(x.rot||0),ex=x.real?x.desem/x.real:0;
 let h=`<div class="card big"><span class="mu">Valor em caixa (auditado) · ${lab(k)}</span><div style="font-size:30px;font-weight:800">${R(caixa)}</div><span class="mu">${caixa>=0?'LIQUIDEZ POSITIVA':'DEFICITÁRIO'} · entradas − saídas desembolsadas</span></div>
 <div class="kp"><div class="card"><span class="mu">Entradas totais</span><b>${R(x.ent)}</b></div><div class="card"><span class="mu">Saídas desembolsadas</span><b>${R(x.desem)}</b></div><div class="card"><span class="mu">A liquidar</span><b>${R(pend)}</b></div><div class="card"><span class="mu">Saídas realizadas</span><b>${R(x.real)}</b></div><div class="card"><span class="mu">Saldo projetado real</span><b class="${proj<0?'bad':'ok'}">${R(proj)}</b></div><div class="card"><span class="mu">% executado</span><b>${P1(ex)}</b></div></div>
 <h3>Auditoria &amp; conciliação de caixa</h3><div class="card"><div class="row"><span>Cobertura de caixa (caixa ÷ a liquidar)</span><b>${pend>0?(caixa/pend).toFixed(2).replace('.',',')+'x':'—'}</b></div><div class="row"><span>Provisão inicial</span><b>${R(x.prov)}</b></div><div class="row"><span>Saldo do mês (provisão)</span><b>${R(x.ent-x.prov)}</b></div><div class="row"><span>Saldo do mês (realizado)</span><b>${R(sr)}</b></div><div class="row"><span>Rotativo a realizar</span><b>${R(x.rot||0)}</b></div><div class="row"><span>Taxa de sobra nominal / real</span><b>${P1(x.ent?sr/x.ent:0)} / ${P1(x.ent?proj/x.ent:0)}</b></div><div class="row"><span>Economia (provisão − realizado)</span><b class="${x.prov-x.real<0?'bad':'ok'}">${R(x.prov-x.real)}</b></div><p class="mu">O saldo projetado real deduz o rotativo a realizar; o nominal reflete só o que já foi lançado.</p></div>`;
 if(det){const ls=det.lancs,nt=S.naturezas.map((n,i)=>({n,i,p:0,r:0}));ls.forEach(l=>{let o=nt.find(z=>z.n===l.n);if(!o){o={n:l.n,i:nt.length,p:0,r:0};nt.push(o)}o.p+=l.prov||0;o.r+=l.real||0});const a=nt.filter(z=>z.p||z.r),tr=a.reduce((s,z)=>s+z.r,0)||1;let ac=0;
  const cg=a.map(z=>{const s=ac;ac+=z.r/tr*100;return `${COR[z.i%9]} ${s}% ${ac}%`}).join(',');
  h+=`<h3>Por natureza</h3><div class="card"><div class="don" style="background:conic-gradient(${cg})"></div>${a.map(z=>`<div class="row"><span><span class="dot" style="background:${COR[z.i%9]}"></span>${esc(z.n)}<small>${P1(z.r/tr)} do realizado · a realizar ${R(z.p-z.r)}</small></span><span style="text-align:right"><b>${R(z.r)}</b><small>de ${R(z.p)}</small></span></div>`).join('')}</div>`}
 const ks=keys();CA=CA&&ks.includes(CA)?CA:ks[Math.max(0,ks.indexOf(k)-1)];CB=CB&&ks.includes(CB)?CB:k;const A=M(CA),B=M(CB);
 const ln=(t,a,b,p)=>{const d=b-a;return `<div class="row"><span>${t}</span><span style="text-align:right">${p?P1(a)+' → '+P1(b):R(a)+' → '+R(b)}<small class="${d<0?'bad':'ok'}">${p?'':R(d)+' · '+P1(a?d/Math.abs(a):0)}</small></span></div>`};
 h+=`<h3>Comparativo De → Para</h3><div class="card"><div class="g2"><select onchange="CA=this.value;go('painel')">${ks.map(z=>`<option value="${z}"${z===CA?' selected':''}>${lab(z)}</option>`).join('')}</select><select onchange="CB=this.value;go('painel')">${ks.map(z=>`<option value="${z}"${z===CB?' selected':''}>${lab(z)}</option>`).join('')}</select></div>
 ${ln('Entradas',A.ent,B.ent)}${ln('Saídas provisionadas',A.prov,B.prov)}${ln('Saídas realizadas',A.real,B.real)}${ln('Saldo realizado',A.ent-A.real,B.ent-B.real)}${ln('Taxa de sobra',A.ent?(A.ent-A.real)/A.ent:0,B.ent?(B.ent-B.real)/B.ent:0,1)}${ln('Índice de execução',A.prov?A.real/A.prov:0,B.prov?B.real/B.prov:0,1)}</div>`;
 const mx=Math.max(...ks.map(z=>Math.max(M(z).ent,M(z).real)))||1;
 h+=`<h3>Histórico mensal</h3><div class="card"><div class="hist">${ks.map(z=>{const y=M(z);return `<div onclick="S.ativo='${z}';sv();go('painel')"><span><i style="height:${y.ent/mx*100}%;background:var(--br)"></i><i style="height:${y.real/mx*100}%;background:var(--ac)"></i></span>${lab(z).slice(0,3)}/${z.slice(2,4)}</div>`}).join('')}</div><p class="mu"><span class="dot" style="background:var(--br)"></span>Entradas <span class="dot" style="background:var(--ac)"></span>Saídas realizadas</p></div>`;return h}
/* ---------- 3. NOVO PLANEJAMENTO ---------- */
const nx=k=>{let[y,m]=k.split('-').map(Number);m++;if(m>12){m=1;y++}return y+'-'+String(m).padStart(2,'0')};
function shift(v,t){if(!v||v==='Rotativa')return v;const[y,m]=t.split('-').map(Number),dd=Math.min(+v.slice(8,10),new Date(y,m,0).getDate());return t+'-'+String(dd).padStart(2,'0')}
function mkPlan(o,t){const m=S.meses[o],c=calc(m);return{o,t,ent:m.entradas.map(e=>({d:e.d,v:/saldo/i.test(e.d)?Math.round((c.ent-c.real)*100)/100:e.v})),
 l:m.lancs.map(l=>{let d=l.d,inc=l.prov>0;const q=d.match(/\(\s*(\d+)\s*de\s*(\d+)\s*\)/);if(q){const n=+q[1]+1;if(n>+q[2])inc=false;d=d.replace(q[0],`(${n} de ${q[2]})`)}return{d,n:l.n,f:l.f,v:shift(l.v,t),prov:l.prov||0,inc}})}}
function vN(){const ks=Object.keys(S.meses).sort();if(!ks.length)return vazio('Importe os dados primeiro (Aprovações › Dados).');
 if(!PL)PL=mkPlan(ks[ks.length-1],nx(ks[ks.length-1]));const p=PL;
 return `<div class="card"><h4>Replicar um mês</h4><div class="g2"><div><label>Copiar de</label><select onchange="PL=mkPlan(this.value,nx(this.value));go('plan')">${ks.map(z=>`<option value="${z}"${z===p.o?' selected':''}>${lab(z)}</option>`).join('')}</select></div><div><label>Novo mês</label><input type="month" value="${p.t}" onchange="PL=mkPlan(PL.o,this.value);go('plan')"></div></div>
 <p class="mu">Parcelas "(n de N)" avançam sozinhas e as quitadas saem desmarcadas. Gastos sem provisão não são copiados. Edite antes de gravar.</p></div>
 <h3>Entradas</h3><div class="card">${p.ent.map((e,i)=>`<div class="pl" style="grid-template-columns:1fr 110px"><input value="${esc(e.d)}" onchange="PL.ent[${i}].d=this.value"><input type="number" step="0.01" value="${e.v}" onchange="PL.ent[${i}].v=+this.value"></div>`).join('')}<button class="sec sm" onclick="PL.ent.push({d:'Nova entrada',v:0});go('plan')">＋ entrada</button></div>
 <h3>Saídas planejadas</h3><div class="card">${p.l.map((l,i)=>`<div class="pl"><input type="checkbox" ${l.inc?'checked':''} onchange="PL.l[${i}].inc=this.checked"><span>${esc(l.d)}<small class="mu" style="display:block">${esc(l.n)} · ${l.v==='Rotativa'?'Rotativa':l.v?l.v.split('-').reverse().join('/'):'sem venc.'}</small></span><input type="number" step="0.01" value="${l.prov}" onchange="PL.l[${i}].prov=+this.value"></div>`).join('')}<div class="row"><b>Total provisionado</b><b>${R(p.l.filter(l=>l.inc).reduce((a,l)=>a+l.prov,0))}</b></div></div>
 <button class="pri" onclick="gravaPlan()">Gravar ${lab(p.t)}</button>`}
function gravaPlan(){const p=PL;if(S.meses[p.t]&&!confirm(lab(p.t)+' já existe. Substituir?'))return;
 S.meses[p.t]={entradas:p.ent.map(e=>({d:e.d,v:e.v})),lancs:p.l.filter(l=>l.inc).map(l=>({id:uid(),d:l.d,n:l.n,f:l.f,v:l.v,p:l.v==='Rotativa'?'Rotativa':null,prov:l.prov,real:0,itens:[]}))};
 S.ativo=p.t;PL=null;sv();toast('Mês planejado ✔');go('lancar')}
/* ---------- APROVAÇÕES + DADOS ---------- */
function vA(){return `<h3>Novas descrições para aprovar</h3><div class="card">${S.pend.length?S.pend.map((x,i)=>`<div class="row"><span>${esc(x.d)}<small>${esc(x.n)} · ${esc(x.f)}</small></span><span><button class="sec sm ac" onclick="apr(${i},1)">Aprovar</button> <button class="x" onclick="apr(${i},0)">Recusar</button></span></div>`).join(''):'<span class="mu">Nada pendente.</span>'}</div>
 <h3>Dados</h3><div class="card"><p class="mu">Os dados ficam só neste aparelho. Para levar ao celular da Rosa (ou fazer backup), exporte e importe o arquivo.</p><div class="g2"><button class="sec" onclick="expo()">⬆ Exportar</button><button class="sec" onclick="$('#fi').click()">⬇ Importar</button></div><input id="fi" type="file" accept=".json" hidden onchange="impo(this.files[0])"></div>`}
function apr(i,ok){const x=S.pend.splice(i,1)[0];if(ok)S.catalogo.push({d:x.d,n:x.n,f:x.f,p:null});sv();toast(ok?'Descrição aprovada':'Descrição recusada');go('aprov')}
async function expo(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),fn='sem-medo-'+hoje()+'.json',f=new File([b],fn,{type:'application/json'});
 if(navigator.canShare?.({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){}}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;a.click()}
function impo(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.meses)throw 0;if(Object.keys(S.meses).length&&!confirm('Isto substitui os dados deste aparelho. Continuar?'))return;S={naturezas:NAT0,formas:FOR0,pend:[],catalogo:[],hist:{},...d};S.ativo=null;sv();toast('Dados importados ✔');go('lancar')}catch(e){toast('Arquivo inválido')}};r.readAsText(f)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
go('lancar');
</script></body></html>
